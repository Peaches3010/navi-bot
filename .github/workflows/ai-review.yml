name: AI Code Review & Test Generation

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main, develop]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > diff.patch
          else
            git diff HEAD~1..HEAD > diff.patch
          fi

      - name: AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ai-review.mjs

      - name: AI Generate Unit Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ai-gen-tests.mjs

      - name: Commit generated tests
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "GitHub Copilot Bot"
          git config user.email "copilot-bot@noreply.github.com"
          git add tests/
          git diff --staged --quiet || git commit -m "chore: AI-generated unit tests"
          git push

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('ai-review-output.md', 'utf8');
            const tests = fs.existsSync('ai-tests-output.md')
              ? fs.readFileSync('ai-tests-output.md', 'utf8')
              : '';

            const body = tests
              ? review + '\n\n---\n\n' + tests
              : review;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });